<!-- OPTION 4: Vertical fabric/topology diagram (EDGE -> Sidecars -> Underlay/Overlay), subtle -->
<svg xmlns="http://www.w3.org/2000/svg" width="260" height="900" viewBox="0 0 260 900" role="img" aria-label="Subtle network fabric diagram">
  <defs>
    <style>
      .bg{fill:transparent}
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","DejaVu Sans Mono", monospace; font-size:14px; }
      .line{stroke:rgba(38,255,122,0.16); stroke-width:2; fill:none}
      .line2{stroke:rgba(15,184,90,0.14); stroke-width:1.5; fill:none}
      .node{fill:rgba(7,11,10,0.0); stroke:rgba(38,255,122,0.18); stroke-width:2}
      .label{fill:#b8bbbc; opacity:0.28}
      .ok{fill:#26ff7a; opacity:0.20}
      .blink{fill:#26ff7a; opacity:0.0}
      @keyframes bl { 0%,70%{opacity:0} 75%,85%{opacity:.35} 100%{opacity:0} }
      .b1{animation:bl 2.8s steps(1,end) infinite}
      .b2{animation:bl 3.4s steps(1,end) infinite}
      .b3{animation:bl 3.0s steps(1,end) infinite}
    </style>
  </defs>

  <!-- Outer faint rail -->
  <rect x="22" y="18" width="216" height="864" rx="10" fill="none" stroke="rgba(38,255,122,0.12)" stroke-width="2"/>
  <rect x="30" y="26" width="200" height="848" rx="8" fill="none" stroke="rgba(15,184,90,0.10)" stroke-width="1.5"/>

  <!-- Nodes -->
  <rect x="70" y="70"  width="120" height="44" rx="10" class="node"/>
  <rect x="38" y="190" width="86"  height="44" rx="10" class="node"/>
  <rect x="136" y="190" width="86" height="44" rx="10" class="node"/>

  <rect x="38" y="330" width="184" height="44" rx="10" class="node"/>
  <rect x="38" y="410" width="184" height="44" rx="10" class="node"/>

  <!-- Links -->
  <path d="M130 114 L130 178" class="line"/>
  <path d="M130 178 L81 190" class="line2"/>
  <path d="M130 178 L179 190" class="line2"/>

  <path d="M81 234 L81 330" class="line"/>
  <path d="M179 234 L179 330" class="line"/>

  <path d="M130 374 L130 410" class="line2"/>

  <!-- Labels -->
  <text x="92" y="98" class="label">[ EDGE ]</text>
  <text x="54" y="218" class="label">SC-A</text>
  <text x="152" y="218" class="label">SC-B</text>

  <text x="52" y="358" class="label">UNDERLAY (DDM)</text>
  <text x="52" y="438" class="label">OVERLAY (OPTE)</text>

  <!-- Tiny status lights -->
  <circle cx="184" cy="92" r="4" class="ok"/>
  <circle cx="108" cy="212" r="4" class="ok"/>
  <circle cx="206" cy="212" r="4" class="ok"/>
  <circle cx="206" cy="352" r="4" class="ok"/>
  <circle cx="206" cy="432" r="4" class="ok"/>

  <!-- Blinking "traffic" dots -->
  <circle cx="130" cy="150" r="4" class="blink b1"/>
  <circle cx="81"  cy="280" r="4" class="blink b2"/>
  <circle cx="179" cy="300" r="4" class="blink b3"/>

  <!-- Footer tags -->
  <text x="44" y="36" class="label">FABRIC</text>
  <text x="176" y="36" class="label">SILO=prod</text>
  <text x="44" y="892" class="label">link-state: OK</text>
</svg>
