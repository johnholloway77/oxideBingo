<!-- HARDWARE: unix double-green border + bottom prompt typing (slower) + stepped print + stepped scroll + sparkline -->
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-label="Unix-style terminal: hardware status printing with bottom typed command and sparkline">
  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","DejaVu Sans Mono", monospace; font-size:16px; }
      .bg{fill:#070b0a}
      .fg{fill:#b8bbbc}.dim{fill:#5b5f61}
      .green{fill:#26ff7a}.g2{fill:#0fb85a}
      .ok{fill:#28c840}.warn{fill:#febc2e}.bad{fill:#ff5f57}

      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      .cursor { animation: blink 1s step-end infinite; }

      /* Timeline:
      0%..48%  : type command (slower)
      48%..100%: print + scroll
      */

      /* --- typing --- */
      @keyframes typeHW {
      0%   { width: 0px; }
      48%  { width: 360px; } /* fits "hw inventory --watch" */
      100% { width: 360px; }
      }
      .cmdReveal { animation: typeHW 8.4s steps(26,end) infinite; }

      @keyframes cursorHW {
      0%   { transform: translateX(0px); opacity:1; }
      47%  { transform: translateX(360px); opacity:1; }
      48%  { transform: translateX(360px); opacity:1; }
      100% { transform: translateX(360px); opacity:1; }
      }
      .cmdCursor { animation: cursorHW 8.4s steps(1,end) infinite; }

      /* --- print reveal (line-by-line) --- */
      @keyframes revealHW {
      0%   { height: 0px; }
      48%  { height: 0px; }
      78%  { height: 336px; } /* 14 lines * 24px */
      88%  { height: 336px; }
      100% { height: 0px; }
      }
      .revealRect { animation: revealHW 8.4s steps(14,end) infinite; }

      /* --- scroll (line jumps) --- */
      @keyframes scrollHW {
      0%,48% { transform: translateY(0px); opacity: 1; }
      78% { transform: translateY(0px); opacity: 1; }

      80% { transform: translateY(-24px); }
      81.5% { transform: translateY(-48px); }
      83% { transform: translateY(-72px); }
      84.5% { transform: translateY(-96px); }
      86% { transform: translateY(-120px); }
      87.5% { transform: translateY(-144px); }
      89% { transform: translateY(-168px); }
      90.5% { transform: translateY(-192px); }
      92% { transform: translateY(-216px); }
      93.5% { transform: translateY(-240px); }

      96% { opacity: 1; }
      97% { opacity: 0; }
      100%{ transform: translateY(0px); opacity: 1; }
      }
      .printCycle { animation: scrollHW 8.4s steps(1,end) infinite; }

      /* sparkline frames */
      .sp{opacity:0}
      @keyframes s0 { 0%,24.9%{opacity:1}25%,100%{opacity:0} }
      @keyframes s1 { 0%,24.9%{opacity:0}25%,49.9%{opacity:1}50%,100%{opacity:0} }
      @keyframes s2 { 0%,49.9%{opacity:0}50%,74.9%{opacity:1}75%,100%{opacity:0} }
      @keyframes s3 { 0%,74.9%{opacity:0}75%,100%{opacity:1} }
      .s0{animation:s0 1.6s steps(1,end) infinite}
      .s1{animation:s1 1.6s steps(1,end) infinite}
      .s2{animation:s2 1.6s steps(1,end) infinite}
      .s3{animation:s3 1.6s steps(1,end) infinite}
    </style>

    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="rgba(0,0,0,.45)"/></filter>

    <!-- Inner viewport -->
    <clipPath id="viewport_hw"><rect x="56" y="56" width="988" height="412"/></clipPath>

    <!-- Printed output area (above the prompt) -->
    <clipPath id="out_hw"><rect x="56" y="72" width="988" height="360"/></clipPath>

    <!-- Printing reveal mask (only affects output region) -->
    <mask id="mask_hw" maskUnits="userSpaceOnUse">
      <rect x="56" y="72" width="988" height="0" fill="white" class="revealRect"/>
    </mask>

    <!-- Command typing mask (bottom line) -->
    <mask id="cmdmask_hw" maskUnits="userSpaceOnUse">
      <rect x="128" y="456" width="0" height="22" fill="white" class="cmdReveal"/>
    </mask>
  </defs>

  <!-- terminal -->
  <rect x="32" y="32" width="1036" height="456" rx="12" class="bg" filter="url(#shadow)"/>
  <rect x="40" y="40" width="1020" height="440" rx="10" fill="none" stroke="#26ff7a" stroke-width="3"/>
  <rect x="48" y="48" width="1004" height="424" rx="8" fill="none" stroke="#0fb85a" stroke-width="2" opacity="0.9"/>

  <g clip-path="url(#viewport_hw)">
    <!-- OUTPUT AREA (clipped separately so it never touches prompt) -->
    <g clip-path="url(#out_hw)">
      <g mask="url(#mask_hw)" class="printCycle">
        <text x="56" y="96" class="dim">RACK-01 / INVENTORY</text>
        <text x="56" y="120" class="fg">┌──────────────────────────────────────────────────────────────────────┐</text>
        <text x="56" y="144" class="fg">│ Sleds (Gimlet)     online  12/32      power  7.3kW       fans  OK     │</text>
        <text x="56" y="168" class="fg">│ Sidecars           A: OK   B: OK      fabric  stable      links  OK    │</text>
        <text x="56" y="192" class="fg">│ Power Shelf        DC bus  54.5V      input   AC OK       temp   35°C  │</text>
        <text x="56" y="216" class="fg">├──────────────────────────────────────────────────────────────────────┤</text>

        <text x="56" y="240" class="fg">│ SLED  STATE     CPU        RAM     SSD bays   SP/RoT       TEMP        │</text>
        <text x="56" y="264" class="fg">│ 01    </text><text x="122" y="264" class="ok">OK</text><text x="160" y="264" class="fg">        64c       512G    10+2      attested    37°C        │</text>
        <text x="56" y="288" class="fg">│ 02    </text><text x="122" y="288" class="ok">OK</text><text x="160" y="288" class="fg">        64c       512G    10+2      attested    38°C        │</text>
        <text x="56" y="312" class="fg">│ 03    </text><text x="122" y="312" class="warn">WARN</text><text x="190" y="312" class="fg">      64c       512G    10+2      update      44°C        │</text>
        <text x="56" y="336" class="fg">│ 04    </text><text x="122" y="336" class="ok">OK</text><text x="160" y="336" class="fg">        64c       512G    10+2      attested    39°C        │</text>

        <text x="56" y="360" class="fg">├──────────────────────────────────────────────────────────────────────┤</text>
        <text x="56" y="384" class="fg">│ Temp trend (sled03)  </text><text x="296" y="384" class="dim">last 32s</text>
        <text x="396" y="384" class="sp s0 fg"> ▁▁▂▃▄▅▆▆▇▇▆▅▄▃▂▂</text>
        <text x="396" y="384" class="sp s1 fg"> ▁▂▃▄▅▆▇▇▆▅▄▃▂▁▁▂</text>
        <text x="396" y="384" class="sp s2 fg"> ▂▃▄▆▇▇▆▄▃▂▁▁▂▃▄▅</text>
        <text x="396" y="384" class="sp s3 fg"> ▃▄▆▇▇▆▅▄▃▂▂▁▂▃▄▆</text>
        <text x="760" y="384" class="dim"> now </text><text x="810" y="384" class="warn">44°C</text>

        <text x="56" y="408" class="fg">│ Notes: sled03 firmware update pending; workload throttled (temp).      │</text>
        <text x="56" y="432" class="fg">└──────────────────────────────────────────────────────────────────────┘</text>
      </g>
    </g>

    <!-- PROMPT AT BOTTOM -->
    <text x="56" y="460" class="green">oxide%</text>

    <!-- dim "full command" as placeholder -->
    <text x="128" y="460" class="dim"> hw inventory --watch</text>

    <!-- bright typed command revealed -->
    <g mask="url(#cmdmask_hw)">
      <text x="128" y="460" class="fg"> hw inventory --watch</text>
    </g>

    <!-- cursor that moves to end of typed command -->
    <g class="cmdCursor">
      <text x="128" y="460" class="green cursor">█</text>
    </g>
  </g>
</svg>
